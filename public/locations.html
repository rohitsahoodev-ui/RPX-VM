<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locations | RPX Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0a0b0d; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(17, 18, 23, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .sidebar { width: 280px; border-right: 1px solid rgba(255,255,255,0.05); }
        .nav-item { display: flex; align-items: center; padding: 0.75rem 1rem; border-radius: 0.75rem; color: #94a3b8; transition: all 0.2s; }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .nav-item.active { background: #2563eb; color: #fff; }
    </style>
</head>
<body class="flex min-h-screen">
    <!-- SIDEBAR -->
    <div class="sidebar p-6 flex flex-col">
        <div class="mb-10 px-2">
            <h1 class="text-xl font-bold text-white tracking-tighter">RPX PANEL</h1>
        </div>

        <nav class="space-y-2 flex-1">
            <p class="text-[10px] font-bold text-gray-600 uppercase tracking-widest mb-4 px-2">Management</p>
            <a href="index.html" class="nav-item"><i class="fas fa-th-large mr-3"></i> Overview</a>
            <a href="servers.html" class="nav-item"><i class="fas fa-server mr-3"></i> Servers</a>
            <a href="billing.html" class="nav-item"><i class="fas fa-credit-card mr-3"></i> Billing</a>

            <p class="text-[10px] font-bold text-gray-600 uppercase tracking-widest mt-8 mb-4 px-2">Administrative</p>
            <a href="users.html" class="nav-item"><i class="fas fa-users mr-3"></i> Users</a>
            <a href="nodes.html" class="nav-item"><i class="fas fa-network-wired mr-3"></i> Nodes</a>
            <a href="locations.html" class="nav-item active"><i class="fas fa-map-marker-alt mr-3"></i> Locations</a>
            <a href="settings.html" class="nav-item"><i class="fas fa-cog mr-3"></i> Settings</a>
        </nav>

        <div class="mt-auto">
            <button onclick="logout()" class="nav-item w-full text-left text-red-400 hover:bg-red-500/10"><i class="fas fa-sign-out-alt mr-3"></i> Logout</button>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="flex-1 p-10 overflow-y-auto">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h2 class="text-2xl font-bold text-white">Location Management</h2>
                <p class="text-gray-500 text-sm">Organize your infrastructure by data centers.</p>
            </div>
            <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-6 rounded-xl transition-all shadow-lg shadow-blue-900/20">
                <i class="fas fa-plus mr-2"></i> Add Location
            </button>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="location_list">
            <!-- Locations will be loaded here -->
        </div>
    </div>

    <!-- MODAL -->
    <div id="modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-6 z-50">
        <div class="glass w-full max-w-lg p-8 rounded-2xl">
            <h3 class="text-xl font-bold text-white mb-6">Add New Location</h3>
            <form id="locationForm" class="space-y-6">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Location Name</label>
                    <input type="text" id="name" required class="w-full bg-gray-900/50 border border-gray-800 rounded-xl p-4 text-sm focus:outline-none focus:border-blue-500 transition-all" placeholder="United States - East">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Short Name</label>
                    <input type="text" id="short_name" required class="w-full bg-gray-900/50 border border-gray-800 rounded-xl p-4 text-sm focus:outline-none focus:border-blue-500 transition-all" placeholder="US-EAST-1">
                </div>
                <div class="flex gap-4">
                    <button type="button" onclick="closeModal()" class="flex-1 bg-gray-800 hover:bg-gray-700 text-white font-bold py-4 rounded-xl transition-all">Cancel</button>
                    <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl transition-all">Create Location</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('rpx_token');
        if(!token) window.location.href = '/login.html';

        async function fetchLocations() {
            const res = await fetch('/api/locations', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            const list = document.getElementById('location_list');
            list.innerHTML = data.map(loc => `
                <div class="glass p-8 rounded-2xl border-l-4 border-blue-500">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h4 class="text-lg font-bold text-white">${loc.name}</h4>
                            <p class="text-xs font-bold text-gray-500 uppercase tracking-widest">${loc.short_name}</p>
                        </div>
                        <div class="w-10 h-10 rounded-lg bg-blue-500/10 flex items-center justify-center text-blue-500">
                            <i class="fas fa-map-marker-alt"></i>
                        </div>
                    </div>
                    <div class="mt-6 flex gap-2">
                        <button class="text-xs font-bold text-gray-500 hover:text-white uppercase tracking-widest transition-all">View Nodes</button>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('locationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const short_name = document.getElementById('short_name').value;

            const res = await fetch('/api/locations', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ name, short_name })
            });

            if (res.ok) {
                closeModal();
                fetchLocations();
            }
        });

        function openModal() { document.getElementById('modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }
        function logout() { localStorage.clear(); window.location.href = '/login.html'; }

        fetchLocations();
    </script>
</body>
</html>
