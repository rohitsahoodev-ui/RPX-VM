<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | RPX Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0a0b0d; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(17, 18, 23, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md p-8 glass rounded-2xl shadow-2xl">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold text-white tracking-tight mb-2">RPX PANEL</h1>
            <p class="text-gray-500 text-sm">V1 - LXC Virtualization Engine</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Email Address</label>
                <input type="email" id="email" required class="w-full bg-gray-900/50 border border-gray-800 rounded-xl p-4 text-sm focus:outline-none focus:border-blue-500 transition-all" placeholder="admin@rpxpanel.io">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Password</label>
                <input type="password" id="password" required class="w-full bg-gray-900/50 border border-gray-800 rounded-xl p-4 text-sm focus:outline-none focus:border-blue-500 transition-all" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-blue-900/20">
                Sign In
            </button>
        </form>

        <div class="mt-8 text-center">
            <p class="text-xs text-gray-600">Default: admin@rpxpanel.io / admin123</p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            if (res.ok) {
                const data = await res.json();
                localStorage.setItem('rpx_token', data.token);
                localStorage.setItem('rpx_role', data.role);
                window.location.href = '/index.html';
            } else {
                alert('Invalid credentials');
            }
        });
    </script>
</body>
</html>
