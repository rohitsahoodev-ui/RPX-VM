<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Server | RPX Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0a0b0d; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(17, 18, 23, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .sidebar { width: 280px; border-right: 1px solid rgba(255,255,255,0.05); }
        .nav-item { display: flex; align-items: center; padding: 0.75rem 1rem; border-radius: 0.75rem; color: #94a3b8; transition: all 0.2s; }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .nav-item.active { background: #2563eb; color: #fff; }
    </style>
</head>
<body class="flex min-h-screen">
    <!-- SIDEBAR -->
    <div class="sidebar p-6 flex flex-col">
        <div class="mb-10 px-2">
            <h1 class="text-xl font-bold text-white tracking-tighter">RPX PANEL</h1>
        </div>

        <nav class="space-y-2 flex-1">
            <p class="text-[10px] font-bold text-gray-600 uppercase tracking-widest mb-4 px-2">Management</p>
            <a href="index.html" class="nav-item"><i class="fas fa-th-large mr-3"></i> Overview</a>
            <a href="servers.html" class="nav-item active"><i class="fas fa-server mr-3"></i> Servers</a>
            <a href="billing.html" class="nav-item"><i class="fas fa-credit-card mr-3"></i> Billing</a>

            <p class="text-[10px] font-bold text-gray-600 uppercase tracking-widest mt-8 mb-4 px-2">Administrative</p>
            <a href="users.html" class="nav-item"><i class="fas fa-users mr-3"></i> Users</a>
            <a href="nodes.html" class="nav-item"><i class="fas fa-network-wired mr-3"></i> Nodes</a>
            <a href="locations.html" class="nav-item"><i class="fas fa-map-marker-alt mr-3"></i> Locations</a>
            <a href="settings.html" class="nav-item"><i class="fas fa-cog mr-3"></i> Settings</a>
        </nav>

        <div class="mt-auto">
            <button onclick="logout()" class="nav-item w-full text-left text-red-400 hover:bg-red-500/10"><i class="fas fa-sign-out-alt mr-3"></i> Logout</button>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="flex-1 p-10 overflow-y-auto">
        <header class="mb-10">
            <h2 class="text-2xl font-bold text-white">Create New Server</h2>
            <p class="text-gray-500 text-sm">Deploy a high-performance LXC container in seconds.</p>
        </header>

        <form id="serverForm" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-8">
                <div class="glass p-8 rounded-2xl">
                    <h3 class="text-xs font-bold text-white uppercase tracking-widest mb-6">General Configuration</h3>
                    <div class="grid grid-cols-2 gap-6">
                        <div class="col-span-2">
                            <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Server Name</label>
                            <input type="text" id="name" required class="w-full bg-gray-900/50 border border-gray-800 rounded-xl p-4 text-sm focus:outline-none focus:border-blue-500 transition-all" placeholder="My-Ubuntu-Server">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Hostname</label>
                            <input type="text" id="hostname" required class="w-full bg-gray-900/50 border border-gray-800 rounded-xl p-4 text-sm focus:outline-none focus:border-blue-500 transition-all" placeholder="ubuntu-vps">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Node</label>
                            <select id="node_id" required class="w-full bg-gray-900/50 border border-gray-800 rounded-xl p-4 text-sm focus:outline-none focus:border-blue-500 transition-all">
                                <!-- Nodes will be loaded here -->
                            </select>
                        </div>
                    </div>
                </div>

                <div class="glass p-8 rounded-2xl">
                    <h3 class="text-xs font-bold text-white uppercase tracking-widest mb-6">Resource Allocation</h3>
                    <div class="grid grid-cols-3 gap-6">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">CPU Cores</label>
                            <input type="number" id="cpu" value="1" min="1" required class="w-full bg-gray-900/50 border border-gray-800 rounded-xl p-4 text-sm focus:outline-none focus:border-blue-500 transition-all">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">RAM (MB)</label>
                            <input type="number" id="ram" value="512" min="128" step="128" required class="w-full bg-gray-900/50 border border-gray-800 rounded-xl p-4 text-sm focus:outline-none focus:border-blue-500 transition-all">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Disk (GB)</label>
                            <input type="number" id="disk" value="10" min="1" required class="w-full bg-gray-900/50 border border-gray-800 rounded-xl p-4 text-sm focus:outline-none focus:border-blue-500 transition-all">
                        </div>
                    </div>
                </div>
            </div>

            <div class="space-y-8">
                <div class="glass p-8 rounded-2xl">
                    <h3 class="text-xs font-bold text-white uppercase tracking-widest mb-6">Summary</h3>
                    <div class="space-y-4 text-sm mb-8">
                        <div class="flex justify-between"><span class="text-gray-500">Virtualization</span> <span class="text-white">LXC</span></div>
                        <div class="flex justify-between"><span class="text-gray-500">OS Template</span> <span class="text-white">Ubuntu 20.04</span></div>
                        <div class="flex justify-between"><span class="text-gray-500">Network</span> <span class="text-white">NAT / Bridge</span></div>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-blue-900/20">
                        Deploy Server
                    </button>
                </div>
            </div>
        </form>
    </div>

    <script>
        const token = localStorage.getItem('rpx_token');
        if(!token) window.location.href = '/login.html';

        async function fetchNodes() {
            const res = await fetch('/api/nodes', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            const select = document.getElementById('node_id');
            select.innerHTML = data.map(node => `<option value="${node.id}">${node.name} (${node.ip})</option>`).join('');
        }

        document.getElementById('serverForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                name: document.getElementById('name').value,
                hostname: document.getElementById('hostname').value,
                node_id: document.getElementById('node_id').value,
                cpu: document.getElementById('cpu').value,
                ram: document.getElementById('ram').value,
                disk: document.getElementById('disk').value,
                user_id: 1 // For now, default to admin user
            };

            const res = await fetch('/api/containers', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                window.location.href = '/servers.html';
            } else {
                alert('Failed to deploy server');
            }
        });

        function logout() { localStorage.clear(); window.location.href = '/login.html'; }
        fetchNodes();
    </script>
</body>
</html>
