<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPX Panel - Register</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background: url('https://picsum.photos/seed/minecraft/1920/1080') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background-color: rgba(13, 17, 23, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid #30363d;
            border-radius: 0.5rem;
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .input-field {
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 0.375rem;
            padding: 0.75rem 1rem;
            width: 100%;
            color: white;
            transition: border-color 0.2s;
        }
        .input-field:focus {
            border-color: #58a6ff;
            outline: none;
        }
        .btn-login {
            background-color: #238636;
            color: white;
            padding: 0.75rem;
            border-radius: 0.375rem;
            font-weight: 600;
            width: 100%;
            transition: background 0.2s;
            margin-top: 1.5rem;
        }
        .btn-login:hover {
            background-color: #2ea043;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-8">
            <i class="fas fa-cube text-4xl text-blue-500 mb-4"></i>
            <h1 class="text-2xl font-bold text-white uppercase tracking-wider">RPX Panel</h1>
        </div>
        
        <form id="registerForm" class="space-y-6">
            <div>
                <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2 ml-1">Email Address</label>
                <input type="email" id="email" required class="input-field" placeholder="admin@rpxpanel.io">
            </div>
            <div>
                <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2 ml-1">Password</label>
                <input type="password" id="password" required class="input-field" placeholder="••••••••">
            </div>
            
            <button type="submit" class="btn-login">Register</button>
        </form>
        
        <div class="mt-8 text-center">
            <a href="/login" class="text-xs text-blue-400 hover:text-blue-300 transition-colors">Already have an account? Login here.</a>
        </div>
        
        <div class="mt-8 text-center">
            <p class="text-[10px] text-gray-600 uppercase tracking-widest">RPX Panel &copy; 2026</p>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (data.success) {
                alert('Registration successful! Please login.');
                window.location.href = '/login';
            } else {
                alert(data.error);
            }
        };
    </script>
</body>
</html>
