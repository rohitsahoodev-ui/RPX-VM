{% extends "base.html" %}

{% block title %}Databases - {{ container.name }}{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-8">
    <div class="flex items-center gap-4">
        <div class="w-10 h-10 rounded-lg bg-gray-800 flex items-center justify-center text-xl text-gray-400">
            <i class="fas fa-database"></i>
        </div>
        <div>
            <h1 class="text-2xl font-bold text-white">Databases</h1>
            <p class="text-xs text-gray-500">Manage MySQL/PostgreSQL databases for your instance.</p>
        </div>
    </div>
    
    <button class="btn-primary">
        <i class="fas fa-plus mr-2"></i> New Database
    </button>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="card p-6 border-blue-500/20 bg-blue-500/5">
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 rounded-lg bg-blue-600 flex items-center justify-center text-white">
                    <i class="fas fa-database"></i>
                </div>
                <div>
                    <h3 class="text-sm font-bold text-white">main_db</h3>
                    <p class="text-[10px] text-gray-500 font-mono">rpx_user_1</p>
                </div>
            </div>
            <div class="flex gap-2">
                <button class="w-8 h-8 rounded-lg bg-gray-800 border border-gray-700 text-gray-400 hover:text-white transition-all flex items-center justify-center">
                    <i class="fas fa-key text-xs"></i>
                </button>
                <button class="w-8 h-8 rounded-lg bg-gray-800 border border-gray-700 text-red-500 hover:bg-red-500 hover:text-white transition-all flex items-center justify-center">
                    <i class="fas fa-trash-alt text-xs"></i>
                </button>
            </div>
        </div>
        
        <div class="space-y-3">
            <div class="flex items-center justify-between p-3 bg-gray-900 rounded-lg border border-gray-800">
                <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Endpoint</span>
                <code class="text-xs text-blue-400">127.0.0.1:3306</code>
            </div>
            <div class="flex items-center justify-between p-3 bg-gray-900 rounded-lg border border-gray-800">
                <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Connections</span>
                <span class="text-xs text-white">0 / 100</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
