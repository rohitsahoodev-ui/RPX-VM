{% extends "base.html" %}

{% block title %}File Manager - {{ container.name }}{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-8">
    <div class="flex items-center gap-4">
        <div class="w-10 h-10 rounded-lg bg-gray-800 flex items-center justify-center text-xl text-gray-400">
            <i class="fas fa-folder-open"></i>
        </div>
        <div>
            <h1 class="text-2xl font-bold text-white">File Manager</h1>
            <p class="text-xs text-gray-500 font-mono">/home/container</p>
        </div>
    </div>
    
    <div class="flex items-center gap-2">
        <button class="px-4 py-2 rounded-lg bg-gray-800 border border-gray-700 text-white text-xs font-bold uppercase tracking-widest hover:border-blue-500/50 transition-all">
            <i class="fas fa-plus mr-2"></i> New File
        </button>
        <button class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold uppercase tracking-widest transition-all">
            <i class="fas fa-upload mr-2"></i> Upload
        </button>
    </div>
</div>

<div class="card overflow-hidden">
    <div class="px-6 py-4 bg-gray-900 border-b border-gray-800 flex items-center gap-4">
        <div class="flex items-center gap-2 text-xs text-gray-500">
            <a href="#" class="hover:text-blue-400">home</a>
            <span>/</span>
            <a href="#" class="hover:text-blue-400">container</a>
        </div>
    </div>
    
    <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="text-[10px] font-bold text-gray-500 uppercase tracking-widest bg-gray-900/30">
                    <th class="px-6 py-4 w-12 text-center">
                        <input type="checkbox" class="rounded border-gray-700 bg-gray-900 text-blue-600">
                    </th>
                    <th class="px-6 py-4">Name</th>
                    <th class="px-6 py-4">Size</th>
                    <th class="px-6 py-4">Modified</th>
                    <th class="px-6 py-4 text-right">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-800/50">
                <tr class="hover:bg-gray-800/20 transition-colors group">
                    <td class="px-6 py-4 text-center">
                        <input type="checkbox" class="rounded border-gray-700 bg-gray-900 text-blue-600">
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <i class="fas fa-folder text-yellow-500"></i>
                            <span class="text-sm text-white font-medium">logs</span>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-xs text-gray-500">--</td>
                    <td class="px-6 py-4 text-xs text-gray-500">2 hours ago</td>
                    <td class="px-6 py-4 text-right">
                        <button class="text-gray-600 hover:text-white transition-colors"><i class="fas fa-ellipsis-v"></i></button>
                    </td>
                </tr>
                <tr class="hover:bg-gray-800/20 transition-colors group">
                    <td class="px-6 py-4 text-center">
                        <input type="checkbox" class="rounded border-gray-700 bg-gray-900 text-blue-600">
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <i class="fas fa-file-code text-blue-400"></i>
                            <span class="text-sm text-white font-medium">server.py</span>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-xs text-gray-500">12.4 KB</td>
                    <td class="px-6 py-4 text-xs text-gray-500">1 day ago</td>
                    <td class="px-6 py-4 text-right">
                        <button class="text-gray-600 hover:text-white transition-colors"><i class="fas fa-ellipsis-v"></i></button>
                    </td>
                </tr>
                <tr class="hover:bg-gray-800/20 transition-colors group">
                    <td class="px-6 py-4 text-center">
                        <input type="checkbox" class="rounded border-gray-700 bg-gray-900 text-blue-600">
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <i class="fas fa-file-alt text-gray-400"></i>
                            <span class="text-sm text-white font-medium">.env</span>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-xs text-gray-500">0.5 KB</td>
                    <td class="px-6 py-4 text-xs text-gray-500">3 days ago</td>
                    <td class="px-6 py-4 text-right">
                        <button class="text-gray-600 hover:text-white transition-colors"><i class="fas fa-ellipsis-v"></i></button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
