<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPX PANEL - Register</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #e4e4e7; }
        .glass { background: rgba(24, 24, 27, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(39, 39, 42, 1); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md glass rounded-3xl p-8 shadow-2xl">
        <div class="flex flex-col items-center mb-8">
            <div class="w-16 h-16 bg-emerald-500 rounded-2xl flex items-center justify-center mb-4 shadow-lg shadow-emerald-500/20">
                <i class="fas fa-bolt text-zinc-950 text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-white">RPX PANEL</h1>
            <p class="text-zinc-500 text-sm mt-1">Create your enterprise account</p>
        </div>

        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-1.5 ml-1">Email Address</label>
                <input type="email" id="email" required class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500/50 transition-all" placeholder="admin@rpxpanel.io">
            </div>
            <div>
                <label class="block text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-1.5 ml-1">Password</label>
                <input type="password" id="password" required class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500/50 transition-all" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-bold py-3 rounded-xl transition-all shadow-lg shadow-emerald-500/20 active:scale-[0.98]">
                Create Account
            </button>
        </form>
        
        <div class="mt-6 text-center space-y-2">
            <a href="/login" class="text-xs text-zinc-500 hover:text-emerald-500 transition-colors block">Already have an account? Sign In</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (data.success) {
                alert('Registration successful! Please login.');
                window.location.href = '/login';
            } else {
                alert(data.error);
            }
        };
    </script>
</body>
</html>
