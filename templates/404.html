{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-[60vh] text-center">
    <div class="w-24 h-24 rounded-full bg-red-600/10 flex items-center justify-center text-4xl text-red-500 mb-8">
        <i class="fas fa-exclamation-triangle"></i>
    </div>
    <h1 class="text-4xl font-bold text-white mb-4">404 - Page Not Found</h1>
    <p class="text-gray-500 mb-8 max-w-md">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
    <a href="/" class="btn-primary px-8 py-3">
        <i class="fas fa-home mr-2"></i> Back to Dashboard
    </a>
</div>
{% endblock %}
