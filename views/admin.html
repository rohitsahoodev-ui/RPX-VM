<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPX PANEL - Admin</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #e4e4e7; }
        .glass { background: rgba(24, 24, 27, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(39, 39, 42, 1); }
    </style>
</head>
<body class="flex min-h-screen">
    <main class="flex-1 p-10">
        <header class="mb-10">
            <h1 class="text-4xl font-bold text-white">Admin Control Center</h1>
            <p class="text-zinc-500 mt-2">Global system monitoring and management.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-10">
            <div class="glass p-8 rounded-3xl">
                <h4 class="text-zinc-500 font-bold uppercase tracking-widest text-xs mb-2">Total Users</h4>
                <p class="text-4xl font-bold text-white"><%= stats.users %></p>
            </div>
            <div class="glass p-8 rounded-3xl">
                <h4 class="text-zinc-500 font-bold uppercase tracking-widest text-xs mb-2">Total VPS</h4>
                <p class="text-4xl font-bold text-white"><%= stats.containers %></p>
            </div>
            <div class="glass p-8 rounded-3xl">
                <h4 class="text-zinc-500 font-bold uppercase tracking-widest text-xs mb-2">Active Nodes</h4>
                <p class="text-4xl font-bold text-white"><%= stats.nodes %></p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <a href="/admin/users" class="glass p-8 rounded-3xl hover:bg-zinc-800/50 transition-all group">
                <div class="flex items-center justify-between">
                    <div>
                        <h3 class="text-xl font-bold text-white">User Management</h3>
                        <p class="text-zinc-500 mt-1">Manage accounts, balances, and permissions.</p>
                    </div>
                    <i class="fas fa-users text-3xl text-zinc-700 group-hover:text-emerald-500 transition-colors"></i>
                </div>
            </a>
            <a href="/admin/nodes" class="glass p-8 rounded-3xl hover:bg-zinc-800/50 transition-all group">
                <div class="flex items-center justify-between">
                    <div>
                        <h3 class="text-xl font-bold text-white">Node Infrastructure</h3>
                        <p class="text-zinc-500 mt-1">Configure host servers and resource pools.</p>
                    </div>
                    <i class="fas fa-server text-3xl text-zinc-700 group-hover:text-blue-500 transition-colors"></i>
                </div>
            </a>
        </div>
    </main>
</body>
</html>
