<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPX PANEL - Profile</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #e4e4e7; }
        .glass { background: rgba(24, 24, 27, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(39, 39, 42, 1); }
    </style>
</head>
<body class="p-10 max-w-4xl mx-auto">
    <header class="mb-10">
        <a href="/dashboard" class="text-emerald-500 hover:text-emerald-400 mb-4 inline-block"><i class="fas fa-arrow-left mr-2"></i> Dashboard</a>
        <h1 class="text-4xl font-bold text-white">Account Settings</h1>
        <p class="text-zinc-500 mt-2">Manage your personal information and security.</p>
    </header>

    <div class="space-y-8">
        <div class="glass p-8 rounded-3xl">
            <h3 class="text-xl font-bold text-white mb-6">Profile Information</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="text-xs font-bold text-zinc-500 uppercase tracking-widest ml-1">Email Address</label>
                    <input type="email" readonly value="<%= user.email %>" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-zinc-400 outline-none">
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold text-zinc-500 uppercase tracking-widest ml-1">Account Role</label>
                    <input type="text" readonly value="<%= user.role.toUpperCase() %>" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-zinc-400 outline-none">
                </div>
            </div>
        </div>

        <div class="glass p-8 rounded-3xl">
            <h3 class="text-xl font-bold text-white mb-6">Security</h3>
            <div class="space-y-6">
                <div class="flex items-center justify-between p-4 rounded-2xl bg-zinc-900 border border-zinc-800">
                    <div>
                        <h5 class="font-bold text-white">Two-Factor Authentication</h5>
                        <p class="text-xs text-zinc-500 mt-1">Add an extra layer of security to your account.</p>
                    </div>
                    <button class="bg-emerald-500/10 text-emerald-500 border border-emerald-500/20 px-4 py-2 rounded-xl font-bold hover:bg-emerald-500/20 transition-all">Enable</button>
                </div>
                <div class="flex items-center justify-between p-4 rounded-2xl bg-zinc-900 border border-zinc-800">
                    <div>
                        <h5 class="font-bold text-white">Change Password</h5>
                        <p class="text-xs text-zinc-500 mt-1">Update your login credentials.</p>
                    </div>
                    <button class="bg-zinc-800 hover:bg-zinc-700 text-white px-4 py-2 rounded-xl font-bold transition-all">Update</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
