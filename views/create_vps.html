<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPX PANEL - Deploy VPS</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #e4e4e7; }
        .glass { background: rgba(24, 24, 27, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(39, 39, 42, 1); }
    </style>
</head>
<body class="flex min-h-screen">
    <!-- Sidebar (Simplified for brevity, usually shared via partials) -->
    <main class="flex-1 p-10 max-w-4xl mx-auto">
        <header class="mb-10">
            <a href="/dashboard" class="text-emerald-500 hover:text-emerald-400 mb-4 inline-block"><i class="fas fa-arrow-left mr-2"></i> Back to Dashboard</a>
            <h1 class="text-4xl font-bold text-white">Deploy New VPS</h1>
            <p class="text-zinc-500 mt-2">Choose your configuration and launch in seconds.</p>
        </header>

        <form id="deployForm" class="space-y-8">
            <div class="glass rounded-3xl p-8 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-zinc-500 uppercase tracking-widest ml-1">Hostname</label>
                        <input type="text" id="hostname" required placeholder="my-vps-01" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-emerald-500/50 outline-none">
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-zinc-500 uppercase tracking-widest ml-1">Operating System</label>
                        <select id="os" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-emerald-500/50 outline-none">
                            <option value="ubuntu-22.04">Ubuntu 22.04 LTS</option>
                            <option value="debian-12">Debian 12</option>
                            <option value="almalinux-9">AlmaLinux 9</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold text-zinc-500 uppercase tracking-widest ml-1">Target Node</label>
                    <select id="node_id" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-emerald-500/50 outline-none">
                        <% nodes.forEach(node => { %>
                        <option value="<%= node.id %>"><%= node.name %> (<%= node.location %>)</option>
                        <% }) %>
                    </select>
                </div>

                <div class="space-y-4">
                    <label class="text-xs font-bold text-zinc-500 uppercase tracking-widest ml-1">Resource Plan</label>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="plan-card glass p-6 rounded-2xl border-2 border-transparent hover:border-emerald-500/50 cursor-pointer transition-all active" onclick="selectPlan(this, 1, 512, 10)">
                            <h4 class="font-bold text-white mb-1">Starter</h4>
                            <p class="text-xs text-zinc-500 mb-4">Perfect for small apps</p>
                            <div class="space-y-2 text-sm">
                                <p><i class="fas fa-microchip mr-2 text-emerald-500"></i> 1 vCPU</p>
                                <p><i class="fas fa-memory mr-2 text-emerald-500"></i> 512 MB RAM</p>
                                <p><i class="fas fa-database mr-2 text-emerald-500"></i> 10 GB SSD</p>
                            </div>
                            <p class="mt-6 font-bold text-emerald-500">$2.50/mo</p>
                        </div>
                        <!-- Add more plans here -->
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-between glass p-6 rounded-3xl">
                <div>
                    <p class="text-xs font-bold text-zinc-500 uppercase tracking-widest">Estimated Cost</p>
                    <p class="text-2xl font-bold text-white">$2.50 <span class="text-sm font-normal text-zinc-500">/ month</span></p>
                </div>
                <button type="submit" class="bg-emerald-500 hover:bg-emerald-400 text-zinc-950 px-10 py-4 rounded-2xl font-bold shadow-lg shadow-emerald-500/20 transition-all active:scale-95">
                    Launch Instance
                </button>
            </div>
        </form>
    </main>

    <script>
        let selectedPlan = { cpu: 1, ram: 512, disk: 10 };

        function selectPlan(el, cpu, ram, disk) {
            document.querySelectorAll('.plan-card').forEach(c => c.classList.remove('border-emerald-500', 'bg-emerald-500/5'));
            el.classList.add('border-emerald-500', 'bg-emerald-500/5');
            selectedPlan = { cpu, ram, disk };
        }

        document.getElementById('deployForm').onsubmit = async (e) => {
            e.preventDefault();
            const token = localStorage.getItem('token');
            const payload = {
                name: document.getElementById('hostname').value,
                os: document.getElementById('os').value,
                node_id: document.getElementById('node_id').value,
                ...selectedPlan
            };

            const res = await fetch('/api/containers', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.id) {
                window.location.href = '/dashboard?token=' + token;
            } else {
                alert(data.error);
            }
        };
    </script>
</body>
</html>
