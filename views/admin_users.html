<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPX PANEL - Admin Users</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #e4e4e7; }
        .glass { background: rgba(24, 24, 27, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(39, 39, 42, 1); }
    </style>
</head>
<body class="p-10 max-w-7xl mx-auto">
    <header class="mb-10 flex items-center justify-between">
        <div>
            <a href="/admin" class="text-emerald-500 hover:text-emerald-400 mb-4 inline-block"><i class="fas fa-arrow-left mr-2"></i> Admin Panel</a>
            <h1 class="text-4xl font-bold text-white">User Management</h1>
            <p class="text-zinc-500 mt-2">Manage all registered accounts on the platform.</p>
        </div>
        <button class="bg-emerald-500 hover:bg-emerald-400 text-zinc-950 px-6 py-3 rounded-xl font-bold transition-all shadow-lg shadow-emerald-500/20">
            Create User
        </button>
    </header>

    <div class="glass rounded-3xl overflow-hidden">
        <table class="w-full text-left">
            <thead>
                <tr class="text-xs font-bold text-zinc-500 uppercase tracking-widest border-b border-zinc-800">
                    <th class="px-8 py-4">User</th>
                    <th class="px-8 py-4">Role</th>
                    <th class="px-8 py-4">Balance</th>
                    <th class="px-8 py-4">Joined</th>
                    <th class="px-8 py-4 text-right">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-zinc-800">
                <% users.forEach(u => { %>
                <tr class="hover:bg-zinc-800/30 transition-colors">
                    <td class="px-8 py-5">
                        <div class="flex items-center space-x-3">
                            <div class="w-8 h-8 rounded-lg bg-zinc-800 flex items-center justify-center text-zinc-400"><i class="fas fa-user"></i></div>
                            <span class="text-sm font-bold text-white"><%= u.email %></span>
                        </div>
                    </td>
                    <td class="px-8 py-5">
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold border <%= u.role === 'admin' ? 'bg-purple-500/10 text-purple-500 border-purple-500/20' : 'bg-zinc-500/10 text-zinc-400 border-zinc-500/20' %>">
                            <%= u.role.toUpperCase() %>
                        </span>
                    </td>
                    <td class="px-8 py-5 text-sm text-zinc-400">$<%= u.balance.toFixed(2) %></td>
                    <td class="px-8 py-5 text-sm text-zinc-500"><%= new Date(u.created_at).toLocaleDateString() %></td>
                    <td class="px-8 py-5 text-right">
                        <button class="p-2 rounded-lg bg-zinc-800 text-zinc-400 hover:text-white transition-all"><i class="fas fa-edit"></i></button>
                    </td>
                </tr>
                <% }) %>
            </tbody>
        </table>
    </div>
</body>
</html>
